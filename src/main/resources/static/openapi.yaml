openapi: 3.0.3
info:
  title: Cleaning Services API
  description: API for managing employees, emitters and generating receipts
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server

components:
  schemas:
    EmployeeRequest:
      type: object
      description: Data to create or update an employee
      required:
        - name
        - cpf
        - role
      properties:
        name:
          type: string
          example: Maria Silva
        cpf:
          type: string
          example: "123.456.789-00"
        role:
          type: string
          enum: [CLEANER, SUPERVISOR, ADMIN]
          example: CLEANER
        email:
          type: string
          example: maria.silva@email.com

    EmployeeResponse:
      type: object
      description: Data returned from an employee
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Maria Silva
        cpf:
          type: string
          example: "123.456.789-00"
        role:
          type: string
          enum: [CLEANER, SUPERVISOR, ADMIN]
          example: CLEANER
        email:
          type: string
          example: maria.silva@email.com

    EmitterRequest:
      type: object
      description: Data to create or update an emitter
      required:
        - companyName
        - signerName
        - cpfCnpj
        - templatePath
      properties:
        companyName:
          type: string
          example: Cleaner Rodrigues
        signerName:
          type: string
          example: Igor Rodrigues dos Santos
        cpfCnpj:
          type: string
          example: "447.924.208-22"
        templatePath:
          type: string
          example: template-cleaner-rodrigues.pdf

    EmitterResponse:
      type: object
      description: Data returned from an emitter
      properties:
        id:
          type: integer
          example: 1
        companyName:
          type: string
          example: Cleaner Rodrigues
        signerName:
          type: string
          example: Igor Rodrigues dos Santos
        cpfCnpj:
          type: string
          example: "447.924.208-22"
        templatePath:
          type: string
          example: template-cleaner-rodrigues.pdf

    ReceiptRequest:
      type: object
      description: Data to generate a receipt PDF
      required:
        - receiptNumber
        - clientName
        - value
        - emitterId
      properties:
        receiptNumber:
          type: integer
          example: 1
        clientName:
          type: string
          example: Vivo VMT
        value:
          type: number
          example: 80.00
        emitterId:
          type: integer
          example: 1

paths:
  /employees:
    post:
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid data
        '409':
          description: CPF or email already exists
    get:
      summary: List all employees
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
  /employees/{id}:
    get:
      summary: Find employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found
    put:
      summary: Update an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid data
        '404':
          description: Employee not found
        '409':
          description: CPF or email already exists
    delete:
      summary: Delete an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Employee deleted successfully
        '404':
          description: Employee not found

  /emitters:
    post:
      summary: Create a new emitter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitterRequest'
      responses:
        '201':
          description: Emitter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitterResponse'
        '400':
          description: Invalid data
        '409':
          description: CPF/CNPJ already exists
    get:
      summary: List all emitters
      responses:
        '200':
          description: Emitter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmitterResponse'

  /emitters/{id}:
    get:
      summary: Find emitter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Emitter found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitterResponse'
        '404':
          description: Emitter not found
    put:
      summary: Update an emitter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitterRequest'
      responses:
        '200':
          description: Emitter updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitterResponse'
        '400':
          description: Invalid data
        '404':
          description: Emitter not found
        '409':
          description: CPF/CNPJ already exists
    delete:
      summary: Delete an emitter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Emitter deleted successfully
        '404':
          description: Emitter not found

  /receipts:
    post:
      summary: Generate a receipt PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid data
        '404':
          description: Emitter not found
