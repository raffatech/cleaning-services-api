spring.application.name=cleaning-services-api
# Aceita conexoes de qualquer rede (necessario para acessar do celular via Wi-Fi)
server.address=0.0.0.0
# Reconhece proxy reverso do Railway (e outros cloud providers)
# Sem isso, o Swagger monta as URLs erradas apontando para localhost
server.forward-headers-strategy=native
# =====================================================================
# PERFIL ATIVO ? controla qual adapter de NFS-e ser? usado
#   mock ? MockNfseAdapter (simulado, sem credenciais)
#   prod ? FocusNfeAdapter (real, exige token + certificado digital)
# =====================================================================
spring.profiles.active=mock
# Conexao com o PostgreSQL rodando no container
spring.datasource.url=jdbc:postgresql://localhost:5432/cleaningservices
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA - cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# dialect explicito para evitar erro no Railway
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Swagger UI disponivel em /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/openapi.yaml
# =============================================
# Focus NFe ? configura??es da API de NFS-e
# =============================================
# Token de acesso ? obtido no painel: focusnfe.com.br > Painel API > Tokens
# NUNCA commitar o valor real aqui ? use vari?vel de ambiente em produ??o
focusnfe.token=${FOCUSNFE_TOKEN:token_aqui}
# Ambiente: homologacao (testes) ou producao (notas reais)
focusnfe.ambiente=homologacao
# URLs das APIs do Focus NFe
focusnfe.url.homologacao=https://homologacao.focusnfe.com.br
focusnfe.url.producao=https://api.focusnfe.com.br
# C?digo IBGE do munic?pio de S?o Paulo (usado no payload da NFS-e)
focusnfe.municipio.sao-paulo=3550308

